[project]
name = "nenapu"
version = "0.1.0"
description = "Portable, self-verifying memory and skill substrate for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Upper bounds, because this is installed as a tool into its own environment
# rather than resolved alongside someone else's application: a cap costs
# nothing here and an uncapped dependency is how a working install breaks on a
# machine that did nothing but run it a month later. `mcp` went 1.x -> 2.0
# under this project without anyone choosing that.
dependencies = [
    "typer>=0.12,<0.28",
    "rich>=13.0,<16",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "mcp>=1.2,<3.0",
    "anthropic>=0.40,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "httpx>=0.27,<1.0"]
lint = ["ruff>=0.6,<1.0"]
# Semantic retrieval. Optional on purpose: FTS5 and the belief layer are the
# floor, and a store must stay searchable on a machine that never installed
# this. fastembed rather than sentence-transformers because the latter pulls
# torch, roughly 800MB, to do inference this does in ONNX in about 50.
embeddings = ["fastembed>=0.4,<1.0"]

[project.scripts]
nenapu = "nenapu.cli:app"
# Short alias: this gets typed a lot in a working session.
nn = "nenapu.cli:app"
nenapu-mcp = "nenapu.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nenapu"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# F: real bugs (unused imports/names, undefined names). Line-length and
# import-sort are this repo's own style choice (see test names past 88
# cols throughout tests/) and are not what a correctness gate is for.
select = ["F"]
