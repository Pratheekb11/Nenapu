[project]
name = "nenapu"
version = "0.1.0"
description = "Portable, self-verifying memory and skill substrate for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "mcp>=1.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
nenapu = "nenapu.cli:app"
# Short alias: this gets typed a lot in a working session.
nn = "nenapu.cli:app"
nenapu-mcp = "nenapu.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nenapu"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
